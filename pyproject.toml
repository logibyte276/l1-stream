[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "l1-stream"
version = "0.1.0"
description = "An optimized, fully tested UDP client for the Unitree L1 LiDAR: parsing, thread-safe buffering, and IMU rotation compensation"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Chunyee Shu" }]
keywords = ["lidar", "unitree", "unilidar", "robotics", "point-cloud", "slam", "udp", "open3d"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]

# numpy is the ONLY hard dependency. Everything heavy is optional, so this
# installs in seconds on a Jetson.
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
# Open3D 0.18 was built against numpy 1.x headers and breaks under numpy 2's
# C ABI, but declares no upper bound itself. Pin the pair, not just the package.
viz = ["open3d>=0.18,<0.19", "numpy<2"]
dev = ["pytest>=7.0", "scipy>=1.7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/logibyte276/l1-stream"
Issues = "https://github.com/logibyte276/l1-stream/issues"

[project.scripts]
l1-monitor = "l1_stream.cli:monitor_main"
l1-visualize = "l1_stream.cli:visualize_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
